name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate against Agent Plugins 1.0.0
        run: |
          pip install jsonschema pyyaml
          python3 .github/scripts/validate-plugin.py
      - name: Validate client-specific manifests
        run: |
          python3 -c "import json; json.load(open('.claude-plugin/marketplace.json')); json.load(open('plugins/batondeck/.claude-plugin/plugin.json')); json.load(open('plugins/batondeck/.mcp.json'))"
      - name: Package plugin
        run: |
          cd plugins && zip -r ../batondeck-plugin-${GITHUB_REF_NAME}.zip batondeck
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: batondeck-plugin-*.zip
          generate_release_notes: true
